name: OmniRecorder
options:
  bundleIdPrefix: com.nruberto
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: NO

packages:
  WhisperKit:
    url: https://github.com/argmaxinc/WhisperKit
    exactVersion: "0.9.0"

targets:
  OmniRecorder:
    type: application
    platform: iOS
    sources:
      - path: OmniRecorder
    preBuildScripts:
      - name: Embed Dev Secrets
        script: python3 "${SRCROOT}/tools/embed-dev-secrets.py"
        basedOnDependencyAnalysis: false
    dependencies:
      - package: WhisperKit
    info:
      path: OmniRecorder/Info.plist
      properties:
        CFBundleDisplayName: Omni Recorder
        NSMicrophoneUsageDescription: "Omni Recorder uses the microphone to capture meeting audio for transcription."
        UIBackgroundModes:
          - audio
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nruberto.OmniRecorder
        TARGETED_DEVICE_FAMILY: "1"
